server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/xml+rss 
        application/json 
        image/svg+xml;

    # Cache static assets (CSS, JS, images, fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CRITICAL: React Router support
    # This is the fix for the 404 issue on page refresh
    # 
    # How it works:
    # 1. try_files $uri        → Try to find the exact file (e.g., /logo.png)
    # 2. try_files $uri/       → Try to find it as a directory (e.g., /assets/)
    # 3. /index.html           → If neither exist, serve index.html instead
    #
    # Why this is needed:
    # - React Router creates "fake" routes like /SignUpDonor, /about, etc.
    # - These routes don't exist as actual files on the server
    # - When user refreshes the page, browser asks Nginx for "/SignUpDonor"
    # - Without this rule: Nginx looks for a file called "SignUpDonor" → 404 error
    # - With this rule: Nginx serves index.html → React loads → React Router reads URL → Shows correct page
    #
    # Real files (CSS, JS, images) will still be served normally because $uri finds them first
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle 404 errors by serving index.html
    error_page 404 /index.html;
}