name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Slack - Build Complete
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Build Status: ${{ job.status }}\nSecurity Scan: Completed\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FOODLINK
            
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 894059646318.dkr.ecr.eu-central-1.amazonaws.com
            
            docker pull 894059646318.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:${{ github.sha }}
            docker pull 894059646318.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:${{ github.sha }}
            
            sed -i "s|foodlink-backend:[^ ]*|foodlink-backend:${{ github.sha }}|" docker-compose-prod.yml
            sed -i "s|foodlink-frontend:[^ ]*|foodlink-frontend:${{ github.sha }}|" docker-compose-prod.yml
            
            docker compose -f docker-compose-prod.yml down
            docker compose -f docker-compose-prod.yml up -d

      - name: Check website health
        id: health
        run: |
          sleep 10
          response=$(curl -s -o /dev/null -w "%{http_code}" https://foodlink.shop)
          if [ "$response" -eq 200 ] || [ "$response" -eq 301 ] || [ "$response" -eq 302 ]; then
            echo "health=Passed" >> $GITHUB_OUTPUT
            echo "Website is healthy (HTTP $response)"
          else
            echo "health=Failed" >> $GITHUB_OUTPUT
            echo "Website returned HTTP $response"
            exit 1
          fi

      - name: Slack - Deployment Status
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment Status: ${{ job.status }}\nHealth Check: ${{ steps.health.outputs.health || 'Skipped' }}\nCommit: ${{ github.sha }}\nSite: https://foodlink.shop"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}