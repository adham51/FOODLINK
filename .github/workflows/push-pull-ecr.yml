name: Deploy to ECR
on:
  # Trigger the workflow on push events to the main branch
  push:
    branches: [main]
jobs:
  deploy:
    name: Deploy to ECR
    # Use the latest Ubuntu runner for compatibility with Docker and AWS CLI
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code to access docker-compose.yml and build contexts
      - name: Check out code
        uses: actions/checkout@v4

            # IMPORTANT: Set up Buildx for caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push backend (with caching!)
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:latest
          cache-from: type=gha  # ← GitHub Actions cache (THE MAGIC!)
          cache-to: type=gha,mode=max

      # Build and push frontend (with caching!)
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # Deploy to EC2 by pulling images and restarting services
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to project directory
            cd ~/FOODLINK
            
            # Login to ECR using IAM role (no credentials needed!)
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 894059646318.dkr.ecr.eu-central-1.amazonaws.com
            
            # Pull new images with commit SHA
            docker pull 894059646318.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:${{ github.sha }}
            docker pull 894059646318.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:${{ github.sha }}
            
            # Update docker-compose-prod.yml with new image tags 
            sed -i "s|foodlink-backend:[^ ]*|foodlink-backend:${{ github.sha }}|" docker-compose-prod.yml
            sed -i "s|foodlink-frontend:[^ ]*|foodlink-frontend:${{ github.sha }}|" docker-compose-prod.yml
            
            # Restart services with new images
            docker compose -f docker-compose-prod.yml down
            docker compose -f docker-compose-prod.yml up -d
            