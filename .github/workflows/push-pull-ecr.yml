name: Deploy to ECR
on:
  # Trigger the workflow on push events to the main branch
  push:
    branches: [main]
jobs:
  deploy:
    name: Deploy to ECR
    # Use the latest Ubuntu runner for compatibility with Docker and AWS CLI
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code to access docker-compose.yml and build contexts
      - name: Check out code
        uses: actions/checkout@v4

      # Set up Docker Buildx for advanced build features (e.g., multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Configure AWS credentials for ECR authentication using secrets stored in GitHub
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      # List all files in the repository recursively for debugging build context
      - name: List repo files
        run: ls -R

      # Build the backend image using docker-compose, based on ./backend/Dockerfile
      - name: Build backend image
        run: docker compose build backend

      # Push the backend image to ECR, tagging with the commit SHA and 'latest'
      - name: Push backend image to ECR
        uses: jwalton/gh-ecr-push@v2
        with:
          region: eu-central-1
          # Local image name generated by docker-compose (project name: foodlink)
          local-image: foodlink_backend:latest  
          # Target ECR repository and tags (commit SHA for versioning, latest for convenience)
          image: foodlink-backend:${{ github.sha }},foodlink-backend:latest

      # Build the frontend image using docker-compose, based on ./frontend/Dockerfile
      - name: Build frontend image
        run: docker compose build frontend

      # Push the frontend image to ECR, tagging with the commit SHA and 'latest'
      - name: Push frontend image to ECR
        uses: jwalton/gh-ecr-push@v2
        with:
          region: eu-central-1
          # Local image name generated by docker-compose (project name: foodlink)
          local-image: foodlink_frontend:latest
          # Target ECR repository and tags (commit SHA for versioning, latest for convenience)
          image: foodlink-frontend:${{ github.sha }},foodlink-frontend:latest

          # Deploy to EC2 by pulling images and restarting services
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Log in to ECR on EC2
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
            # Pull images from ECR using commit SHA
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:${{ github.sha }}
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:${{ github.sha }}
            # Update docker-compose-prod.yml with new image tags
            sed -i "s|foodlink-backend:[^ ]*|foodlink-backend:${{ github.sha }}|" docker-compose-prod.yml
            sed -i "s|foodlink-frontend:[^ ]*|foodlink-frontend:${{ github.sha }}|" docker-compose-prod.yml
            # Stop and restart services using production compose file
            docker-compose -f docker-compose-prod.yml down
            docker-compose -f docker-compose-prod.yml up -d