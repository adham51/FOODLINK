name: Deploy to ECR

on:
  push:
    branches: [main]
jobs:
  deploy:
    name: Deploy to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
    
      - name: List repo files
        run: ls -R

      - name: Build backend image
        run: docker compose build backend

      - name: Push backend image to ECR
        uses: jwalton/gh-ecr-push@v2
        with:
          region: eu-central-1
          local-image: foodlink_backend:latest
          image: foodlink-backend:${{ github.sha }},foodlink-backend:latest

      - name: Build frontend image
        run: docker-compose build frontend

      - name: Push frontend image to ECR
        uses: jwalton/gh-ecr-push@v2
        with:
          region: eu-central-1
          local-image: foodlink_frontend:latest
          image: foodlink-frontend:${{ github.sha }},foodlink-frontend:latest