services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sql_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: ${DB_HOST}
    depends_on:
      - db
    networks:
      - sql_net

  backend:
    image: 894059646318.dkr.ecr.eu-central-1.amazonaws.com/foodlink-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "3003"
    depends_on:
      - db
    networks:
      - sql_net

  frontend:
    image: 894059646318.dkr.ecr.eu-central-1.amazonaws.com/foodlink-frontend:latest
    container_name: frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - sql_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sql_net

# no need for certbot a cronjob on server does the job!

volumes:
  db_data:
  certbot_certs:
  certbot_www:

networks:
  sql_net:
    driver: bridge
